<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>zy產品照打樣室</title>
  <style>
    :root {
      --bg: #111215;
      --sidebar: #18191d;
      --card: #222329;
      --border: #2c2d35;
      --text: #eaebee;
      --muted: #8b8d99;
      --accent: #e57373;
      --accent-active: #ef5350;
      --btn-bg: #2a2b33;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang TC", "Microsoft JhengHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    header {
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 52px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      z-index: 50;
      pointer-events: none;
    }
    .brand-title {
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 1px;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 10px;
      pointer-events: auto;
    }
    .brand-title span { font-size: 11px; font-weight: normal; color: var(--muted); }
    .top-center-tabs {
      display: flex;
      background: rgba(30,31,38,0.9);
      backdrop-filter: blur(8px);
      padding: 3px;
      border-radius: 20px;
      border: 1px solid var(--border);
      pointer-events: auto;
    }
    .top-tab {
      background: transparent;
      border: none;
      color: var(--muted);
      padding: 6px 18px;
      border-radius: 16px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .top-tab.active { background: #fff; color: #111; }

    aside {
      width: 380px;
      height: 100vh;
      background: var(--sidebar);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      z-index: 20;
      padding-top: 52px;
    }
    .step-tabs {
      display: flex;
      overflow-x: auto;
      border-bottom: 1px solid var(--border);
      background: rgba(0,0,0,0.15);
    }
    .step-btn {
      flex: 1;
      min-width: 65px;
      padding: 10px 4px;
      background: transparent;
      border: none;
      border-bottom: 2px solid transparent;
      color: var(--muted);
      font-size: 11px;
      cursor: pointer;
      text-align: center;
    }
    .step-btn.active { color: #fff; font-weight: 600; border-color: var(--accent); }
    
    .panel-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .panel-scroll::-webkit-scrollbar { width: 4px; }
    .panel-scroll::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    .sec-h {
      font-size: 12px;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }

    .pill-btn {
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 10px;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
      text-align: center;
      transition: all 0.15s;
    }
    .pill-btn:hover { border-color: var(--muted); }
    .pill-btn.active {
      border-color: var(--accent);
      background: rgba(229,115,115,0.12);
      color: var(--accent);
      font-weight: 600;
    }

    .form-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      margin-bottom: 8px;
    }
    .form-row label { color: var(--muted); }
    .form-row input[type="number"], .form-row select {
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 5px 8px;
      border-radius: 5px;
      width: 95px;
      font-size: 12px;
      text-align: right;
    }
    .form-row input[type="range"] {
      width: 140px;
      accent-color: var(--accent);
    }
    .form-row input[type="color"] {
      border: 1px solid var(--border);
      background: transparent;
      width: 40px; height: 26px;
      border-radius: 4px;
      cursor: pointer;
    }

    .upload-box {
      border: 1px dashed var(--border);
      padding: 10px 12px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
      background: var(--card);
    }
    .upload-box span { font-size: 12px; }
    .upload-box button {
      background: var(--btn-bg);
      border: 1px solid var(--border);
      color: #fff;
      padding: 4px 10px;
      border-radius: 4px;
      font-size: 11px;
      cursor: pointer;
    }

    .product-list-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 12px;
      background: var(--card);
      padding: 8px;
      border-radius: 8px;
      border: 1px solid var(--border);
    }
    .chip {
      padding: 4px 8px;
      border-radius: 4px;
      background: #18191d;
      font-size: 11px;
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      border: 1px solid transparent;
    }
    .chip.active { border-color: var(--accent); color: var(--accent); font-weight: 600; }
    .chip .del { font-weight: bold; cursor: pointer; color: #ff5252; margin-left: 2px; }

    main {
      flex: 1;
      position: relative;
      background: #0d0e12;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    #viewport3d { width: 100%; height: 100%; position: absolute; inset: 0; }
    #canvas2d, #canvasDie {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: none;
    }

    .bottom-bar {
      position: absolute;
      bottom: 20px;
      display: flex;
      align-items: center;
      gap: 16px;
      background: rgba(24,25,29,0.92);
      border: 1px solid var(--border);
      padding: 8px 18px;
      border-radius: 30px;
      backdrop-filter: blur(10px);
      z-index: 30;
      font-size: 12px;
    }
    .angle-btns { display: flex; gap: 6px; }
    .angle-btn {
      background: transparent;
      border: none;
      color: var(--muted);
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 11px;
      cursor: pointer;
    }
    .angle-btn:hover, .angle-btn.active { color: #fff; background: var(--card); }
    .interact-row { display: flex; align-items: center; gap: 8px; border-left: 1px solid var(--border); padding-left: 16px; }

    .primary-btn {
      width: 100%;
      background: var(--accent);
      border: none;
      color: #fff;
      padding: 12px;
      border-radius: 6px;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .primary-btn:hover { background: var(--accent-active); }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

  <header>
    <div class="brand-title">
      zy產品照打樣室 <span>· 擬真打樣與材質模擬系統</span>
    </div>
    <div class="top-center-tabs">
      <button class="top-tab active" onclick="setViewMode('3d')">3D 預覽</button>
      <button class="top-tab" onclick="setViewMode('die')">展開圖 (刀模)</button>
      <button class="top-tab" onclick="setViewMode('2d')">2D 平面打樣</button>
    </div>
    <div style="width: 120px;"></div>
  </header>

  <aside>
    <div class="step-tabs">
      <button class="step-btn active" onclick="setStep(0)">01 品項尺寸</button>
      <button class="step-btn" onclick="setStep(1)">02 紙材工藝</button>
      <button class="step-btn" onclick="setStep(2)">03 部件貼圖</button>
      <button class="step-btn" onclick="setStep(3)">04 光線場景</button>
      <button class="step-btn" onclick="setStep(4)">05 輸出圖片</button>
    </div>

    <div class="panel-scroll" id="stepPanels">
      <!-- 步驟 1: 品項與尺寸 -->
      <div id="step-0" class="step-content">
        <div class="sec-h">
          <span>畫面上的產品列表</span>
          <span style="font-size:10px; color:var(--accent);">點選切換／✕ 刪除</span>
        </div>
        <div class="product-list-chips" id="productChips"></div>

        <div class="sec-h">新增實體產品至畫面</div>
        <div class="grid-2" style="margin-bottom: 14px;">
          <button class="pill-btn" onclick="addNewProduct('vinyl')">＋ 黑膠 12" 封套</button>
          <button class="pill-btn" onclick="addNewProduct('cd_jewel')">＋ CD 寶麗盒 (塑膠)</button>
          <button class="pill-btn" onclick="addNewProduct('cd_digipak')">＋ CD Digipak (紙質)</button>
          <button class="pill-btn" onclick="addNewProduct('calendar_desk')">＋ 桌曆 (三角上翻)</button>
          <button class="pill-btn" onclick="addNewProduct('notebook')">＋ 筆記本 (多頁翻動)</button>
          <button class="pill-btn" onclick="addNewProduct('photocard')">＋ 滿版照片小卡</button>
          <button class="pill-btn" onclick="addNewProduct('postcard')">＋ 明信片 / 單卡</button>
        </div>

        <div class="sec-h">所選品項外觀尺寸 (MM)</div>
        <div class="form-row">
          <label>寬度 (W)</label>
          <input type="number" id="dimW" oninput="applyCurrentSettings()">
        </div>
        <div class="form-row">
          <label>高度 (H)</label>
          <input type="number" id="dimH" oninput="applyCurrentSettings()">
        </div>
        <div class="form-row" id="rowSpine">
          <label>厚度 / 書背 (Spine)</label>
          <input type="number" id="dimSpine" oninput="applyCurrentSettings()">
        </div>
        <div class="form-row" id="rowPages">
          <label>內頁總頁數 (Pages)</label>
          <input type="number" id="dimPages" min="1" max="24" value="5" oninput="onPagesCountChange()">
        </div>
        <div class="form-row" id="rowRadius">
          <label>圓角半徑 (Radius)</label>
          <input type="number" id="dimRadius" oninput="applyCurrentSettings()">
        </div>

        <div class="sec-h" style="margin-top:14px;">展開圖刀模出血設定</div>
        <div class="form-row">
          <label>出血尺寸</label>
          <div style="display:flex; gap:4px; align-items:center;">
            <input type="number" id="bleedVal" value="3" style="width:55px;" oninput="applyCurrentSettings()">
            <select id="bleedUnit" style="width:55px;" onchange="applyCurrentSettings()">
              <option value="mm">mm</option>
              <option value="cm">cm</option>
            </select>
          </div>
        </div>
        <div class="form-row">
          <label>出血線位置</label>
          <select id="bleedPos" onchange="applyCurrentSettings()">
            <option value="outside">產品外部 (外擴出血)</option>
            <option value="inside">產品內部 (內縮安全線)</option>
          </select>
        </div>
      </div>

      <!-- 步驟 2: 材質工藝 -->
      <div id="step-1" class="step-content" style="display:none;">
        <div class="sec-h">材質紋理預設</div>
        <div class="grid-3" style="margin-bottom: 14px;">
          <button class="pill-btn active" onclick="setPaper('coated')">銅版紙</button>
          <button class="pill-btn" onclick="setPaper('matte')">雪銅紙</button>
          <button class="pill-btn" onclick="setPaper('kraft')">牛皮紙</button>
          <button class="pill-btn" onclick="setPaper('holotech')">雷射金屬</button>
          <button class="pill-btn" onclick="setPaper('pearl')">珠光紙</button>
          <button class="pill-btn" onclick="setPaper('clear')">透明壓克力</button>
        </div>
        <div class="sec-h">微調參數</div>
        <div class="form-row">
          <label>金屬反射光澤</label>
          <input type="range" id="metalness" min="0" max="1" step="0.05" oninput="applyCurrentSettings()">
        </div>
        <div class="form-row">
          <label>表面消光粗糙度</label>
          <input type="range" id="roughness" min="0.05" max="1" step="0.05" oninput="applyCurrentSettings()">
        </div>
      </div>

      <!-- 步驟 3: 部件貼圖 -->
      <div id="step-2" class="step-content" style="display:none;">
        <div class="sec-h">獨立部件圖稿替換</div>
        <div id="uploadBoxContainer"></div>
        <input type="file" id="fileIn" style="display:none;" accept="image/*">
        <p style="font-size: 11px; color: var(--muted); margin-top: 8px;">* 支援高解析 PNG/JPG。各部件獨立指定，3D/2D 即時映射。</p>
      </div>

      <!-- 步驟 4: 光線場景 -->
      <div id="step-3" class="step-content" style="display:none;">
        <div class="sec-h">攝影棚燈光氛圍</div>
        <div class="form-row">
          <label>燈光預設</label>
          <select id="lightPreset" onchange="updateLighting()">
            <option value="studio">商業柔光 (Studio Soft)</option>
            <option value="rim">輪廓硬光 (Rim Light)</option>
            <option value="dramatic">高對比暗調 (Dramatic)</option>
          </select>
        </div>
        <div class="form-row">
          <label>光源方向旋轉</label>
          <input type="range" id="lightAngle" min="0" max="360" value="45" oninput="updateLighting()">
        </div>
        <div class="sec-h" style="margin-top: 14px;">背景真實材質</div>
        <div class="form-row">
          <label>自訂環境底色</label>
          <input type="color" id="customBgColor" value="#14151a" oninput="updateCustomBg(this.value)">
        </div>
        <div class="grid-2">
          <button class="pill-btn active" id="btn_bg_studio" onclick="setBgPreset('studio')">攝影棚磨砂深灰</button>
          <button class="pill-btn" id="btn_bg_pure_white" onclick="setBgPreset('pure_white')">純白背景</button>
          <button class="pill-btn" id="btn_bg_linen" onclick="setBgPreset('linen')">棉麻布紋</button>
          <button class="pill-btn" id="btn_bg_transparent" onclick="setBgPreset('transparent')">透明 (PNG 陰影)</button>
        </div>
      </div>

      <!-- 步驟 5: 輸出圖片 -->
      <div id="step-4" class="step-content" style="display:none;">
        <div class="sec-h">匯出規格</div>
        <div class="form-row">
          <label>版面尺寸</label>
          <select id="exportRatio">
            <option value="1">1:1 正方形 (2048px)</option>
            <option value="1.25">4:5 直式貼文 (1600x2000px)</option>
            <option value="1.77">9:16 限動 (1080x1920px)</option>
          </select>
        </div>
        <div class="form-row">
          <label>格式</label>
          <select id="exportFormat">
            <option value="png">PNG (透明/保留陰影)</option>
            <option value="jpeg">高品質 JPG</option>
          </select>
        </div>
        <button class="primary-btn" onclick="executeExport()">立即下載打樣成品圖</button>
      </div>

      <button class="primary-btn" style="background:#2f5d62; margin-top: auto;" onclick="confirmChanges()">✔ 儲存並確認更動</button>
    </div>
  </aside>

  <main id="mainStage">
    <div id="viewport3d"></div>
    <canvas id="canvas2d"></canvas>
    <canvas id="canvasDie"></canvas>

    <div class="bottom-bar" id="bottomBar">
      <div class="angle-btns">
        <button class="angle-btn" onclick="setCameraAngle('top')">俯視平放</button>
        <button class="angle-btn active" onclick="setCameraAngle('iso')">展台立視 (45°)</button>
        <button class="angle-btn" onclick="setCameraAngle('low')">低角度</button>
        <button class="angle-btn" onclick="setCameraAngle('side')">側面</button>
        <button class="angle-btn" onclick="setCameraAngle('back')">翻面</button>
      </div>
      <div class="interact-row">
        <span id="openLabel">開闔 / 翻頁 / 抽出</span>
        <input type="range" id="openSlider" min="0" max="1" step="0.005" value="0.25" oninput="onInteractChange(this.value)">
      </div>
    </div>
  </main>

  <script>
    // --- 貼圖生成工具 ---
    function makeArt(text, sub, bg = '#161c28') {
      const c = document.createElement('canvas');
      c.width = 1024; c.height = 1024;
      const ctx = c.getContext('2d');
      ctx.fillStyle = bg;
      ctx.fillRect(0, 0, 1024, 1024);
      ctx.strokeStyle = 'rgba(255,255,255,0.08)';
      ctx.lineWidth = 2;
      for (let r = 50; r < 800; r += 40) {
        ctx.beginPath(); ctx.arc(512, 512, r, 0, Math.PI * 2); ctx.stroke();
      }
      ctx.fillStyle = '#f0c674';
      ctx.font = 'bold 58px sans-serif';
      ctx.fillText(text, 90, 220);
      ctx.fillStyle = '#ffffff';
      ctx.font = '24px sans-serif';
      ctx.fillText(sub, 90, 280);
      return new THREE.CanvasTexture(c);
    }

    // 黑膠唱片：嚴格對齊 (512, 512)，中心孔洞與圓形標籤完美置中
    function makeVinylTexture() {
      const c = document.createElement('canvas');
      c.width = 1024; c.height = 1024;
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#0a0a0c';
      ctx.fillRect(0, 0, 1024, 1024);

      for (let r = 210; r < 500; r += 2) {
        ctx.strokeStyle = `rgba(255,255,255,${0.03 + (r % 6 === 0 ? 0.05 : 0)})`;
        ctx.lineWidth = 1;
        ctx.beginPath(); ctx.arc(512, 512, r, 0, Math.PI * 2); ctx.stroke();
      }
      ctx.fillStyle = '#f4f1ea';
      ctx.beginPath(); ctx.arc(512, 512, 175, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#111';
      ctx.font = 'bold 36px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('MIDNIGHT', 512, 480);
      ctx.font = '18px sans-serif';
      ctx.fillText('SIDE A · 33 RPM', 512, 530);
      return new THREE.CanvasTexture(c);
    }

    // CD 光碟：真實銀白金屬反光材質
    function makeCDTexture() {
      const c = document.createElement('canvas');
      c.width = 1024; c.height = 1024;
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#d8dee6';
      ctx.fillRect(0, 0, 1024, 1024);

      const grad = ctx.createRadialGradient(512, 512, 100, 512, 512, 512);
      grad.addColorStop(0, '#f8fafc');
      grad.addColorStop(0.5, '#c0c7d0');
      grad.addColorStop(1, '#e2e8f0');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 1024, 1024);

      ctx.fillStyle = '#1c2438';
      ctx.beginPath();
      ctx.arc(512, 512, 490, Math.PI, Math.PI * 2);
      ctx.arc(512, 512, 190, Math.PI * 2, Math.PI, true);
      ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 34px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('LUNA HARBOR', 512, 360);
      return new THREE.CanvasTexture(c);
    }

    // 生成背景真實材質貼圖
    function makeNoiseTexture(type = 'studio') {
      const c = document.createElement('canvas');
      c.width = 512; c.height = 512;
      const ctx = c.getContext('2d');
      ctx.fillStyle = type === 'linen' ? '#252422' : '#14151a';
      ctx.fillRect(0, 0, 512, 512);

      if (type === 'linen') {
        ctx.strokeStyle = 'rgba(255,255,255,0.04)';
        for (let i = 0; i < 512; i += 4) {
          ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, 512); ctx.stroke();
          ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(512, i); ctx.stroke();
        }
      } else {
        const id = ctx.getImageData(0, 0, 512, 512);
        for (let i = 0; i < id.data.length; i += 4) {
          const n = (Math.random() - 0.5) * 12;
          id.data[i] += n; id.data[i+1] += n; id.data[i+2] += n;
        }
        ctx.putImageData(id, 0, 0);
      }
      const t = new THREE.CanvasTexture(c);
      t.wrapS = t.wrapT = THREE.RepeatWrapping;
      t.repeat.set(8, 8);
      return t;
    }

    // --- 資料結構 (多產品管理) ---
    let products = [
      {
        id: 'p1',
        type: 'vinyl',
        w: 314, h: 314, spine: 6, radius: 0, pages: 1,
        metalness: 0.05, roughness: 0.65,
        pos3D: { x: 0, y: 0, z: 0 },
        pos2D: { x: 120, y: 150 },
        textures: {
          front: makeArt('MIDNIGHT ROUTE', 'LUNA HARBOR', '#161c28'),
          back: makeArt('TRACKLIST', '1. Harbor Lights\n2. Low Tide', '#1e2430'),
          disc: makeVinylTexture()
        }
      }
    ];
    let selectedId = 'p1';

    function getSelectedProduct() {
      return products.find(p => p.id === selectedId) || products[0];
    }

    function calculateAutoX() {
      let currentX = 0;
      products.forEach((p) => {
        p.pos3D.x = currentX;
        currentX += (p.w / 100) + 1.2;
      });
      const centerX = (currentX - 1.2) / 2;
      products.forEach(p => p.pos3D.x -= centerX);
    }

    // --- 3D 渲染系統 (Three.js) ---
    let scene, camera, renderer, controls, studioRoot, groundMesh;
    let keyLight, fillLight, rimLight;

    function init3D() {
      const container = document.getElementById('viewport3d');
      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera(40, container.clientWidth / container.clientHeight, 0.1, 100);

      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
      renderer.setSize(container.clientWidth, container.clientHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.0;
      container.appendChild(renderer.domElement);

      controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.05;
      controls.screenSpacePanning = true;
      controls.maxPolarAngle = Math.PI / 2 + 0.02;

      keyLight = new THREE.DirectionalLight(0xfff7ea, 2.0);
      keyLight.position.set(5, 8, 5);
      keyLight.castShadow = true;
      keyLight.shadow.mapSize.set(2048, 2048);
      keyLight.shadow.bias = -0.0001;
      scene.add(keyLight);

      fillLight = new THREE.DirectionalLight(0xdbe6ff, 0.8);
      fillLight.position.set(-6, 4, -2);
      scene.add(fillLight);

      rimLight = new THREE.DirectionalLight(0xffffff, 1.0);
      rimLight.position.set(0, 6, -6);
      scene.add(rimLight);

      scene.add(new THREE.AmbientLight(0xffffff, 0.45));

      const gGeo = new THREE.PlaneGeometry(80, 80);
      const gMat = new THREE.MeshStandardMaterial({
        color: 0x14151a,
        roughness: 0.9,
        metalness: 0.1,
        map: makeNoiseTexture('studio')
      });
      groundMesh = new THREE.Mesh(gGeo, gMat);
      groundMesh.rotation.x = -Math.PI / 2;
      groundMesh.position.y = 0;
      groundMesh.receiveShadow = true;
      scene.add(groundMesh);

      studioRoot = new THREE.Group();
      scene.add(studioRoot);

      calculateAutoX();
      buildAll3DModels();
      setCameraAngle('iso');
      renderLoop();
    }

    function buildAll3DModels() {
      while(studioRoot.children.length > 0) studioRoot.remove(studioRoot.children[0]);

      products.forEach((p) => {
        const itemRoot = new THREE.Group();
        itemRoot.position.set(p.pos3D.x, p.pos3D.y, p.pos3D.z);
        itemRoot.userData.id = p.id;

        const w = p.w / 100;
        const h = p.h / 100;
        const spine = Math.max((p.spine || 4) / 100, 0.01);

        const frontMat = new THREE.MeshStandardMaterial({
          map: p.textures.front,
          metalness: p.metalness,
          roughness: p.roughness
        });

        const backMat = new THREE.MeshStandardMaterial({
          map: p.textures.back || p.textures.front,
          metalness: p.metalness,
          roughness: p.roughness
        });

        const insideMat = new THREE.MeshStandardMaterial({
          map: p.textures.inside || p.textures.front,
          metalness: p.metalness,
          roughness: p.roughness
        });

        if (p.type === 'vinyl') {
          // 黑膠封套
          const jacketMatArr = [backMat, backMat, backMat, backMat, frontMat, backMat];
          const jacket = new THREE.Mesh(new THREE.BoxGeometry(w, h, spine), jacketMatArr);
          jacket.position.y = h / 2;
          jacket.castShadow = true; jacket.receiveShadow = true;
          itemRoot.add(jacket);

          // 黑膠唱片：嚴格原點 (0,0) 置中幾何
          const recShape = new THREE.Shape();
          recShape.absarc(0, 0, w * 0.46, 0, Math.PI * 2, false);
          const hole = new THREE.Path();
          hole.absarc(0, 0, 0.035, 0, Math.PI * 2, true);
          recShape.holes.push(hole);

          const recGeo = new THREE.ExtrudeGeometry(recShape, { depth: 0.012, bevelEnabled: false, curveSegments: 64 });
          recGeo.center(); // 校準中心

          const recMat = new THREE.MeshStandardMaterial({
            map: p.textures.disc || makeVinylTexture(),
            metalness: 0.35,
            roughness: 0.25
          });
          const disc = new THREE.Mesh(recGeo, recMat);
          disc.rotation.set(0, 0, 0); // 垂直平直放置
          disc.position.set(0, 0, 0);
          disc.castShadow = true; disc.receiveShadow = true;
          disc.name = 'disc';
          jacket.add(disc);
        }
        else if (p.type === 'cd_jewel') {
          // CD 寶麗盒：硬質透明壓克力盒，光碟置於底座托盤內
          const baseGroup = new THREE.Group();
          baseGroup.position.y = h / 2;

          const acrylMat = new THREE.MeshPhysicalMaterial({
            transmission: 0.92, opacity: 1, transparent: true,
            roughness: 0.05, ior: 1.5, thickness: 0.08
          });

          // 底座
          const bottomCase = new THREE.Mesh(new THREE.BoxGeometry(w, h, spine * 0.5), acrylMat);
          bottomCase.position.z = -spine * 0.25;
          baseGroup.add(bottomCase);

          // 底紙背卡 (封底)
          const backInlay = new THREE.Mesh(new THREE.PlaneGeometry(w * 0.96, h * 0.96), backMat);
          backInlay.position.z = -spine * 0.24;
          baseGroup.add(backInlay);

          // CD 光碟片：精準嵌在底座中央托盤內部
          const cdShape = new THREE.Shape();
          cdShape.absarc(0, 0, w * 0.42, 0, Math.PI * 2, false);
          const cdHole = new THREE.Path();
          cdHole.absarc(0, 0, 0.065, 0, Math.PI * 2, true);
          cdShape.holes.push(cdHole);

          const cdGeo = new THREE.ExtrudeGeometry(cdShape, { depth: 0.01, bevelEnabled: false, curveSegments: 64 });
          cdGeo.center();
          const cdMesh = new THREE.Mesh(cdGeo, new THREE.MeshStandardMaterial({
            map: p.textures.disc || makeCDTexture(),
            metalness: 0.95, roughness: 0.1
          }));
          cdMesh.position.set(0, 0, 0.01);
          cdMesh.castShadow = true;
          baseGroup.add(cdMesh);

          // 鉸鏈旋轉軸組 (左側翻蓋)
          const hingeGroup = new THREE.Group();
          hingeGroup.position.set(-w / 2, 0, spine * 0.25);

          const lidMesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, spine * 0.4), acrylMat);
          lidMesh.position.set(w / 2, 0, 0);
          lidMesh.castShadow = true;

          // 歌詞本正面
          const booklet = new THREE.Mesh(new THREE.PlaneGeometry(w * 0.94, h * 0.94), frontMat);
          booklet.position.set(w / 2, 0, -spine * 0.18);
          hingeGroup.add(lidMesh, booklet);

          hingeGroup.name = 'hinge';
          baseGroup.add(hingeGroup);
          itemRoot.add(baseGroup);
        }
        else if (p.type === 'cd_digipak') {
          // CD Digipak：紙質對折翻蓋，光碟位於右內頁托盤內部
          const digiGroup = new THREE.Group();
          digiGroup.position.y = h / 2;

          // 右托盤內頁
          const rightPage = new THREE.Mesh(new THREE.BoxGeometry(w, h, spine * 0.4), insideMat);
          rightPage.position.x = w / 2;
          rightPage.castShadow = true; rightPage.receiveShadow = true;
          digiGroup.add(rightPage);

          // 光碟片放置於右托盤中
          const cdShape = new THREE.Shape();
          cdShape.absarc(0, 0, w * 0.42, 0, Math.PI * 2, false);
          const cdHole = new THREE.Path();
          cdHole.absarc(0, 0, 0.065, 0, Math.PI * 2, true);
          cdShape.holes.push(cdHole);
          const cdGeo = new THREE.ExtrudeGeometry(cdShape, { depth: 0.01, bevelEnabled: false, curveSegments: 64 });
          cdGeo.center();
          const cdMesh = new THREE.Mesh(cdGeo, new THREE.MeshStandardMaterial({
            map: p.textures.disc || makeCDTexture(),
            metalness: 0.95, roughness: 0.1
          }));
          cdMesh.position.set(w / 2, 0, spine * 0.22);
          cdMesh.castShadow = true;
          digiGroup.add(cdMesh);

          // 左頁封面翻蓋 (書背鉸鏈在 x = 0)
          const leftHinge = new THREE.Group();
          leftHinge.position.set(0, 0, spine * 0.2);

          const leftPage = new THREE.Mesh(new THREE.BoxGeometry(w, h, spine * 0.35), [backMat, backMat, backMat, backMat, frontMat, backMat]);
          leftPage.position.set(w / 2, 0, 0); // 旋轉為 0 時剛好覆蓋右頁
          leftPage.castShadow = true;
          leftHinge.add(leftPage);
          leftHinge.name = 'hinge';

          digiGroup.add(leftHinge);
          itemRoot.add(digiGroup);
        }
        else if (p.type === 'calendar_desk') {
          // 桌曆：實體倒 V 型三角立體支架 (依範例截圖完全重寫幾何)
          const calRoot = new THREE.Group();
          const standDepth = 0.55 * (p.spine || 25) / 10;
          const standHeight = h;
          calRoot.position.y = 0;

          // 繪製截面形狀以產生一體成型厚紙折疊三角座
          const standShape = new THREE.Shape();
          const halfBottom = (p.spine || 25) / 100 / 2;
          standShape.moveTo(-halfBottom, 0);
          standShape.lineTo(0, standHeight);
          standShape.lineTo(halfBottom, 0);
          standShape.lineTo(0, standHeight * 0.15); // 內折卡榫
          standShape.closePath();

          const standGeo = new THREE.ExtrudeGeometry(standShape, { depth: w, bevelEnabled: false });
          standGeo.center(); // 置中
          const standMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.75 });
          const standMesh = new THREE.Mesh(standGeo, standMat);
          standMesh.rotation.y = Math.PI / 2;
          standMesh.position.y = standHeight / 2;
          standMesh.castShadow = true; standMesh.receiveShadow = true;
          calRoot.add(standMesh);

          // 頂部金屬雙線圈
          const ringsCount = 20;
          const coilRoot = new THREE.Group();
          coilRoot.position.set(-w / 2 + 0.04, standHeight, 0);
          const coilGeo = new THREE.TorusGeometry(0.032, 0.005, 8, 24);
          const coilMat = new THREE.MeshStandardMaterial({ color: 0xcccccc, metalness: 0.9, roughness: 0.15 });

          for (let i = 0; i < ringsCount; i++) {
            const ringMesh = new THREE.Mesh(coilGeo, coilMat);
            ringMesh.position.x = (i / (ringsCount - 1)) * (w - 0.08);
            ringMesh.rotation.y = Math.PI / 2;
            ringMesh.castShadow = true;
            coilRoot.add(ringMesh);
          }
          calRoot.add(coilRoot);

          // 多頁連續上翻系統 (貼合前側斜面)
          const pagesGroup = new THREE.Group();
          pagesGroup.name = 'pagesGroup';
          const totalPages = p.pages || 5;
          const slantAngle = Math.atan2(halfBottom, standHeight); // 正確傾角

          for (let k = 0; k < totalPages; k++) {
            const pageHinge = new THREE.Group();
            pageHinge.position.set(0, standHeight, halfBottom * 0.05 + k * 0.002);
            pageHinge.userData.index = k;

            const pageTexture = (k === 0) ? p.textures.front : (p.textures['page_' + k] || p.textures.inside || frontMat.map);
            const sheetMat = new THREE.MeshStandardMaterial({
              map: pageTexture,
              metalness: p.metalness,
              roughness: p.roughness,
              side: THREE.DoubleSide
            });

            const pageSheet = new THREE.Mesh(new THREE.PlaneGeometry(w * 0.96, standHeight * 0.96), sheetMat);
            pageSheet.rotation.x = slantAngle;
            pageSheet.position.set(0, -standHeight / 2, halfBottom / 2);
            pageSheet.castShadow = true;
            pageHinge.add(pageSheet);
            pagesGroup.add(pageHinge);
          }
          calRoot.add(pagesGroup);
          itemRoot.add(calRoot);
        }
        else if (p.type === 'notebook') {
          // 筆記本：多頁左翻
          const nbRoot = new THREE.Group();
          nbRoot.position.y = h / 2;

          const baseCover = new THREE.Mesh(new THREE.BoxGeometry(w, h, spine * 0.4), backMat);
          baseCover.position.x = w / 2;
          baseCover.castShadow = true; baseCover.receiveShadow = true;
          nbRoot.add(baseCover);

          const pagesGroup = new THREE.Group();
          pagesGroup.name = 'pagesGroup';
          const totalPages = p.pages || 5;

          for (let k = 0; k < totalPages; k++) {
            const pageHinge = new THREE.Group();
            pageHinge.position.set(0, 0, spine * 0.2 + k * 0.004);
            pageHinge.userData.index = k;

            const pageTexture = (k === 0) ? p.textures.front : (p.textures['page_' + k] || p.textures.inside || frontMat.map);
            const sheetMat = new THREE.MeshStandardMaterial({
              map: pageTexture,
              metalness: p.metalness,
              roughness: p.roughness
            });

            const sheet = new THREE.Mesh(new THREE.BoxGeometry(w, h, 0.005), sheetMat);
            sheet.position.set(w / 2, 0, 0);
            sheet.castShadow = true;
            pageHinge.add(sheet);
            pagesGroup.add(pageHinge);
          }
          nbRoot.add(pagesGroup);
          itemRoot.add(nbRoot);
        }
        else {
          // 滿版小卡 / 明信片
          const cardMatArr = [backMat, backMat, backMat, backMat, frontMat, backMat];
          const card = new THREE.Mesh(new THREE.BoxGeometry(w, h, spine), cardMatArr);
          card.position.y = h / 2;
          card.castShadow = true; card.receiveShadow = true;
          itemRoot.add(card);
        }

        studioRoot.add(itemRoot);
      });

      onInteractChange(document.getElementById('openSlider').value);
    }

    function renderLoop() {
      requestAnimationFrame(renderLoop);
      if (currentView === '3d') {
        controls.update();
        renderer.render(scene, camera);
      }
    }

    // --- 連續接力翻頁 / 抽出 ---
    function onInteractChange(val) {
      val = parseFloat(val);
      const curr = getSelectedProduct();
      const itemGroup = studioRoot.children.find(c => c.userData.id === curr.id);
      if (itemGroup) {
        if (curr.type === 'vinyl') {
          const disc = itemGroup.getObjectByName('disc');
          if (disc) disc.position.x = val * (curr.w / 100) * 0.85; // 黑膠唱片水平向右滑出
        }
        else if (curr.type === 'calendar_desk') {
          const pg = itemGroup.getObjectByName('pagesGroup');
          if (pg) {
            const count = pg.children.length;
            pg.children.forEach((hinge, idx) => {
              const start = idx / count;
              const end = (idx + 1) / count;
              const pVal = Math.min(Math.max((val - start) / (end - start), 0), 1);
              hinge.rotation.x = -pVal * (Math.PI * 0.88);
            });
          }
        }
        else if (curr.type === 'notebook') {
          const pg = itemGroup.getObjectByName('pagesGroup');
          if (pg) {
            const count = pg.children.length;
            pg.children.forEach((hinge, idx) => {
              const start = idx / count;
              const end = (idx + 1) / count;
              const pVal = Math.min(Math.max((val - start) / (end - start), 0), 1);
              hinge.rotation.y = -pVal * (Math.PI * 0.85);
            });
          }
        }
        else if (curr.type === 'cd_digipak') {
          const hinge = itemGroup.getObjectByName('hinge');
          if (hinge) hinge.rotation.y = val * (Math.PI * 0.85); // 0度閉合，向左展開
        }
        else {
          const hinge = itemGroup.getObjectByName('hinge');
          if (hinge) hinge.rotation.y = -val * (Math.PI * 0.78);
        }
      }
      if (currentView === '2d') render2DCanvas();
    }

    // --- 視角切換：垂直俯視平放 vs 展台立體展示 ---
    function setCameraAngle(angle) {
      document.querySelectorAll('.angle-btn').forEach(b => b.classList.remove('active'));
      event?.target?.classList?.add('active');

      const curr = getSelectedProduct();
      const dist = (curr.w / 100) * 2.8;
      const h = (curr.h / 100) / 2;

      controls.target.set(curr.pos3D.x, h, curr.pos3D.z);
      if (angle === 'top') {
        // 垂直俯視
        camera.position.set(curr.pos3D.x, dist * 1.6, curr.pos3D.z + 0.001);
      } else if (angle === 'iso') {
        // 展台立體透視視角
        camera.position.set(curr.pos3D.x + dist * 0.8, dist * 0.7, curr.pos3D.z + dist * 0.9);
      } else if (angle === 'low') {
        camera.position.set(curr.pos3D.x + dist * 0.9, h * 0.9, curr.pos3D.z + dist * 0.6);
      } else if (angle === 'side') {
        camera.position.set(curr.pos3D.x + dist * 1.4, h, curr.pos3D.z);
      } else if (angle === 'back') {
        camera.position.set(curr.pos3D.x, h * 1.2, curr.pos3D.z - dist * 1.2);
      }
      controls.update();
    }

    // --- 2D 與展開圖平移縮放系統 ---
    const viewTransform = {
      die: { x: 0, y: 0, scale: 1 },
      plan2d: { x: 0, y: 0, scale: 1 }
    };

    function attachCanvasControls(canvas, viewKey, redrawFn) {
      let isPanning = false, startPos = { x: 0, y: 0 };

      canvas.addEventListener('mousedown', e => {
        if (e.button === 1 || (e.button === 0 && !drag2DItem)) {
          isPanning = true;
          startPos = { x: e.clientX - viewTransform[viewKey].x, y: e.clientY - viewTransform[viewKey].y };
        }
      });

      window.addEventListener('mousemove', e => {
        if (isPanning && ((viewKey === 'die' && currentView === 'die') || (viewKey === 'plan2d' && currentView === '2d'))) {
          viewTransform[viewKey].x = e.clientX - startPos.x;
          viewTransform[viewKey].y = e.clientY - startPos.y;
          redrawFn();
        }
      });

      window.addEventListener('mouseup', () => isPanning = false);

      canvas.addEventListener('wheel', e => {
        e.preventDefault();
        const zoomFactor = e.deltaY < 0 ? 1.08 : 0.92;
        viewTransform[viewKey].scale = Math.min(Math.max(viewTransform[viewKey].scale * zoomFactor, 0.2), 5.0);
        redrawFn();
      }, { passive: false });
    }

    // --- 展開圖 (刀模) 繪製 ---
    function renderDieCanvas() {
      const cvs = document.getElementById('canvasDie');
      const ctx = cvs.getContext('2d');
      cvs.width = cvs.clientWidth;
      cvs.height = cvs.clientHeight;
      const W = cvs.width, H = cvs.height;
      ctx.fillStyle = '#18191d';
      ctx.fillRect(0, 0, W, H);

      ctx.save();
      const vt = viewTransform.die;
      ctx.translate(W / 2 + vt.x, H / 2 + vt.y);
      ctx.scale(vt.scale, vt.scale);

      const curr = getSelectedProduct();
      const pw = curr.w * 1.2, ph = curr.h * 1.2;
      const spine = (curr.spine || 6) * 1.2;
      const totalW = pw * 2 + spine;
      const x0 = -totalW / 2, y0 = -ph / 2;

      // 出血設定與計算
      const bRaw = parseFloat(document.getElementById('bleedVal')?.value || 3);
      const bUnit = document.getElementById('bleedUnit')?.value || 'mm';
      const bPos = document.getElementById('bleedPos')?.value || 'outside';
      const bMm = bUnit === 'cm' ? bRaw * 10 : bRaw;
      const bPx = bMm * 1.2 * (bPos === 'outside' ? 1 : -1);

      ctx.fillStyle = '#f6f6f8';
      ctx.fillRect(x0, y0, totalW, ph);

      // 圖稿
      if (curr.textures.back && curr.textures.back.image) ctx.drawImage(curr.textures.back.image, x0, y0, pw, ph);
      if (curr.textures.front && curr.textures.front.image) ctx.drawImage(curr.textures.front.image, x0 + pw + spine, y0, pw, ph);

      // 印刷框
      ctx.strokeStyle = '#2c2d35';
      ctx.strokeRect(x0, y0, pw, ph);
      ctx.strokeRect(x0 + pw, y0, spine, ph);
      ctx.strokeRect(x0 + pw + spine, y0, pw, ph);

      // 出血線 (洋紅)
      ctx.strokeStyle = '#e91e63';
      ctx.lineWidth = 1.5;
      ctx.strokeRect(x0 - bPx, y0 - bPx, totalW + bPx * 2, ph + bPx * 2);

      // 折線 (藍色虛線)
      ctx.strokeStyle = '#2196f3';
      ctx.setLineDash([6, 4]);
      ctx.beginPath();
      ctx.moveTo(x0 + pw, y0); ctx.lineTo(x0 + pw, y0 + ph);
      ctx.moveTo(x0 + pw + spine, y0); ctx.lineTo(x0 + pw + spine, y0 + ph);
      ctx.stroke();
      ctx.setLineDash([]);

      ctx.fillStyle = '#888';
      ctx.font = '12px sans-serif';
      ctx.fillText(`完成尺寸：${curr.w * 2 + curr.spine} × ${curr.h} mm (出血: ${bRaw}${bUnit} ${bPos==='outside'?'外擴':'內縮'})`, x0, y0 - 18);
      ctx.fillText('封底 (Back)', x0 + pw / 2 - 30, y0 + ph / 2);
      ctx.fillText('書背', x0 + pw + spine / 2 - 12, y0 + ph / 2);
      ctx.fillText('封面 (Front)', x0 + pw + spine + pw / 2 - 30, y0 + ph / 2);

      ctx.restore();
    }

    // --- 2D 平面多品項排版 (含真實背景材質、動態光影方位與正圓孔洞唱片) ---
    function render2DCanvas() {
      const cvs = document.getElementById('canvas2d');
      const ctx = cvs.getContext('2d');
      cvs.width = cvs.clientWidth;
      cvs.height = cvs.clientHeight;
      const W = cvs.width, H = cvs.height;

      // 底色
      ctx.fillStyle = document.getElementById('customBgColor').value;
      ctx.fillRect(0, 0, W, H);

      ctx.save();
      const vt = viewTransform.plan2d;
      ctx.translate(vt.x, vt.y);
      ctx.scale(vt.scale, vt.scale);

      const openVal = parseFloat(document.getElementById('openSlider').value);

      // 動態計算光影方位 (依光源旋轉角度滑桿)
      const lightDeg = parseFloat(document.getElementById('lightAngle')?.value || 45);
      const rad = (lightDeg * Math.PI) / 180;
      const shadowDist = 20 + openVal * 15;
      const offsetX = Math.cos(rad) * shadowDist;
      const offsetY = Math.sin(rad) * shadowDist;

      products.forEach(p => {
        ctx.save();
        ctx.translate(p.pos2D.x, p.pos2D.y);

        ctx.shadowColor = 'rgba(0,0,0,0.45)';
        ctx.shadowBlur = 30 + openVal * 15;
        ctx.shadowOffsetX = offsetX;
        ctx.shadowOffsetY = offsetY;

        // 黑膠唱片：2D 正圓裁剪繪製，中心挖空孔洞
        if (p.type === 'vinyl' && openVal > 0) {
          ctx.save();
          const slideX = p.w * openVal * 0.78;
          ctx.translate(slideX, 0);

          const rOut = p.w * 0.46;
          const rHole = p.w * 0.035;
          const cx = p.w / 2, cy = p.h / 2;

          // 限制裁剪為正圓並扣除中心孔洞
          ctx.beginPath();
          ctx.arc(cx, cy, rOut, 0, Math.PI * 2, false);
          ctx.arc(cx, cy, rHole, 0, Math.PI * 2, true);
          ctx.clip('evenodd');

          ctx.fillStyle = '#0a0a0c';
          ctx.fillRect(cx - rOut, cy - rOut, rOut * 2, rOut * 2);

          if (p.textures.disc && p.textures.disc.image) {
            ctx.drawImage(p.textures.disc.image, cx - rOut, cy - rOut, rOut * 2, rOut * 2);
          }
          ctx.restore();
        }

        // CD 光碟：2D 正圓裁剪繪製，中心挖空孔洞 (不呈現白色內頁紙)
        if ((p.type === 'cd_jewel' || p.type === 'cd_digipak') && openVal > 0) {
          ctx.save();
          const slideX = p.w * openVal * 0.85;
          ctx.translate(slideX, 0);

          const rOut = p.w * 0.42;
          const rHole = p.w * 0.065;
          const cx = p.w / 2, cy = p.h / 2;

          ctx.beginPath();
          ctx.arc(cx, cy, rOut, 0, Math.PI * 2, false);
          ctx.arc(cx, cy, rHole, 0, Math.PI * 2, true);
          ctx.clip('evenodd');

          ctx.fillStyle = '#d8dee6';
          ctx.fillRect(cx - rOut, cy - rOut, rOut * 2, rOut * 2);

          if (p.textures.disc && p.textures.disc.image) {
            ctx.drawImage(p.textures.disc.image, cx - rOut, cy - rOut, rOut * 2, rOut * 2);
          }
          ctx.restore();
        }

        // 封面本體
        ctx.fillStyle = '#fff';
        ctx.fillRect(0, 0, p.w, p.h);
        if (p.textures.front && p.textures.front.image) {
          ctx.drawImage(p.textures.front.image, 0, 0, p.w, p.h);
        }

        if (p.id === selectedId) {
          ctx.strokeStyle = '#e57373';
          ctx.lineWidth = 3;
          ctx.strokeRect(-2, -2, p.w + 4, p.h + 4);
        }
        ctx.restore();
      });

      ctx.restore();
    }

    // --- 2D 精準單一拖曳 ---
    let drag2DItem = null, offset2D = { x: 0, y: 0 };
    const cvs2D = document.getElementById('canvas2d');
    cvs2D.addEventListener('mousedown', e => {
      if (e.button !== 0) return;
      const r = cvs2D.getBoundingClientRect();
      const vt = viewTransform.plan2d;
      const mx = (e.clientX - r.left - vt.x) / vt.scale;
      const my = (e.clientY - r.top - vt.y) / vt.scale;

      for (let i = products.length - 1; i >= 0; i--) {
        const p = products[i];
        if (mx >= p.pos2D.x && mx <= p.pos2D.x + p.w && my >= p.pos2D.y && my <= p.pos2D.y + p.h) {
          selectProduct(p.id);
          drag2DItem = p;
          offset2D.x = mx - p.pos2D.x;
          offset2D.y = my - p.pos2D.y;
          break;
        }
      }
    });

    window.addEventListener('mousemove', e => {
      if (drag2DItem && currentView === '2d') {
        const r = cvs2D.getBoundingClientRect();
        const vt = viewTransform.plan2d;
        const mx = (e.clientX - r.left - vt.x) / vt.scale;
        const my = (e.clientY - r.top - vt.y) / vt.scale;
        drag2DItem.pos2D.x = mx - offset2D.x;
        drag2DItem.pos2D.y = my - offset2D.y;
        render2DCanvas();
      }
    });
    window.addEventListener('mouseup', () => drag2DItem = null);

    // --- 介面管理與同步 ---
    function syncChipsUI() {
      const container = document.getElementById('productChips');
      container.innerHTML = '';
      products.forEach((p, idx) => {
        const chip = document.createElement('div');
        chip.className = `chip ${p.id === selectedId ? 'active' : ''}`;
        const nameMap = {
          vinyl: '黑膠封套',
          cd_digipak: 'CD Digipak',
          cd_jewel: 'CD 寶麗盒',
          calendar_desk: '桌曆(上翻)',
          notebook: '筆記本',
          photocard: '滿版小卡',
          postcard: '明信片'
        };
        chip.innerHTML = `<span>#${idx+1} ${nameMap[p.type] || p.type}</span><span class="del" onclick="deleteProduct('${p.id}', event)">✕</span>`;
        chip.onclick = () => selectProduct(p.id);
        container.appendChild(chip);
      });
    }

    function selectProduct(id) {
      selectedId = id;
      const p = getSelectedProduct();

      document.getElementById('dimW').value = p.w;
      document.getElementById('dimH').value = p.h;
      document.getElementById('dimSpine').value = p.spine;
      document.getElementById('dimRadius').value = p.radius;
      document.getElementById('dimPages').value = p.pages || 5;
      document.getElementById('metalness').value = p.metalness;
      document.getElementById('roughness').value = p.roughness;

      document.getElementById('rowSpine').style.display = 'flex';
      document.getElementById('rowPages').style.display = (p.type === 'calendar_desk' || p.type === 'notebook') ? 'flex' : 'none';

      syncUploadBoxes();
      syncChipsUI();
      buildAll3DModels();
      if (currentView === 'die') renderDieCanvas();
      if (currentView === '2d') render2DCanvas();
      setCameraAngle('iso');
    }

    function onPagesCountChange() {
      const p = getSelectedProduct();
      p.pages = parseInt(document.getElementById('dimPages').value) || 5;
      syncUploadBoxes();
      buildAll3DModels();
    }

    function syncUploadBoxes() {
      const p = getSelectedProduct();
      const container = document.getElementById('uploadBoxContainer');
      container.innerHTML = '';

      let parts = [{ key: 'front', label: '正面 / 封面' }, { key: 'back', label: '背面 / 封底' }];
      if (p.type === 'vinyl') {
        parts = [
          { key: 'front', label: '黑膠外套正面' },
          { key: 'back', label: '黑膠外套封底' },
          { key: 'disc', label: '黑膠唱片盤面 (中心自動開孔)' }
        ];
      } else if (p.type === 'cd_jewel') {
        parts = [
          { key: 'front', label: '歌詞本封面 (正面)' },
          { key: 'back', label: '托盤背卡底紙 (封底)' },
          { key: 'disc', label: 'CD 光碟盤面 (中心自動開孔)' }
        ];
      } else if (p.type === 'cd_digipak') {
        parts = [
          { key: 'front', label: 'Digipak 外折封面' },
          { key: 'back', label: 'Digipak 內折底頁' },
          { key: 'inside', label: '右托盤內襯圖稿' },
          { key: 'disc', label: 'CD 光碟盤面 (中心自動開孔)' }
        ];
      } else if (p.type === 'calendar_desk' || p.type === 'notebook') {
        // 多頁動態獨立貼圖替換
        const total = p.pages || 5;
        parts = [{ key: 'front', label: '封面 (第 1 頁)' }];
        for (let i = 1; i < total; i++) {
          parts.push({ key: 'page_' + i, label: `內頁 (第 ${i + 1} 頁)` });
        }
        parts.push({ key: 'back', label: '封底' });
      }

      parts.forEach(pt => {
        const box = document.createElement('div');
        box.className = 'upload-box';
        box.innerHTML = `<span>${pt.label}</span><button onclick="triggerUpload('${pt.key}')">替換照片</button>`;
        container.appendChild(box);
      });
    }

    function addNewProduct(type) {
      const presets = {
        vinyl: { w: 314, h: 314, spine: 6, r: 0, tex: { front: makeArt('MIDNIGHT', 'LUNA HARBOR', '#161c28'), back: makeArt('TRACKLIST', '1. Harbor Lights', '#1e2430'), disc: makeVinylTexture() } },
        cd_digipak: { w: 140, h: 125, spine: 8, r: 0, tex: { front: makeArt('DIGIPAK', 'SINGLE', '#232b36'), back: makeArt('LYRICS', 'BOOKLET', '#1a2233'), inside: makeArt('INSIDE', 'ART', '#28313e'), disc: makeCDTexture() } },
        cd_jewel: { w: 142, h: 125, spine: 10, r: 2, tex: { front: makeArt('JEWEL', 'CASE', '#2a3342'), back: makeArt('BACK INLAY', 'BARCODE', '#1f242e'), disc: makeCDTexture() } },
        calendar_desk: { w: 150, h: 210, spine: 25, r: 0, pages: 5, tex: { front: makeArt('2027 CALENDAR', 'DESK EDITION', '#3a2e2b') } },
        notebook: { w: 148, h: 210, spine: 14, r: 4, pages: 5, tex: { front: makeArt('NOTEBOOK', 'JOURNAL', '#2e382b') } },
        photocard: { w: 55, h: 85, spine: 0.5, r: 4, tex: { front: makeArt('PHOTO', 'CARD', '#382228'), back: makeArt('AUTOGRAPH', 'SPECIAL', '#201618') } },
        postcard: { w: 148, h: 100, spine: 0.5, r: 0, tex: { front: makeArt('POSTCARD', 'EDITION', '#25292e'), back: makeArt('STAMP HERE', 'POSTAL', '#e8e8e8') } }
      };

      const base = presets[type];
      const newP = {
        id: 'p_' + Date.now(),
        type: type,
        w: base.w, h: base.h, spine: base.spine, radius: base.r, pages: base.pages || 1,
        metalness: 0.05, roughness: 0.65,
        pos3D: { x: (products.length) * 3.8, y: 0, z: 0 },
        pos2D: { x: 100 + products.length * 180, y: 150 },
        textures: { ...base.tex }
      };

      products.push(newP);
      calculateAutoX();
      selectProduct(newP.id);
    }

    function deleteProduct(id, e) {
      e.stopPropagation();
      if (products.length <= 1) return alert('畫面中請至少保留一個產品！');
      products = products.filter(p => p.id !== id);
      calculateAutoX();
      selectProduct(products[0].id);
    }

    function applyCurrentSettings() {
      const p = getSelectedProduct();
      p.w = parseFloat(document.getElementById('dimW').value) || p.w;
      p.h = parseFloat(document.getElementById('dimH').value) || p.h;
      p.spine = parseFloat(document.getElementById('dimSpine').value) || 0;
      p.radius = parseFloat(document.getElementById('dimRadius').value) || 0;
      p.pages = parseInt(document.getElementById('dimPages').value) || p.pages;
      p.metalness = parseFloat(document.getElementById('metalness').value);
      p.roughness = parseFloat(document.getElementById('roughness').value);

      buildAll3DModels();
      if (currentView === 'die') renderDieCanvas();
      if (currentView === '2d') render2DCanvas();
    }

    function confirmChanges() {
      applyCurrentSettings();
      alert('✔ 所有設定已即時保存並套用至各打樣視圖！');
    }

    let uploadTarget = 'front';
    function triggerUpload(target) {
      uploadTarget = target;
      document.getElementById('fileIn').click();
    }

    document.getElementById('fileIn').addEventListener('change', e => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = ev => {
        const img = new Image();
        img.onload = () => {
          const tex = new THREE.Texture(img);
          tex.needsUpdate = true;
          const p = getSelectedProduct();
          p.textures[uploadTarget] = tex;
          buildAll3DModels();
          if (currentView === 'die') renderDieCanvas();
          if (currentView === '2d') render2DCanvas();
        };
        img.src = ev.target.result;
      };
      reader.readAsDataURL(file);
    });

    let currentView = '3d';
    function setViewMode(mode) {
      currentView = mode;
      document.querySelectorAll('.top-tab').forEach((t, i) => {
        t.classList.toggle('active', (i === 0 && mode === '3d') || (i === 1 && mode === 'die') || (i === 2 && mode === '2d'));
      });

      document.getElementById('viewport3d').style.display = mode === '3d' ? 'block' : 'none';
      document.getElementById('canvasDie').style.display = mode === 'die' ? 'block' : 'none';
      document.getElementById('canvas2d').style.display = mode === '2d' ? 'block' : 'none';
      document.getElementById('bottomBar').style.display = mode === '3d' ? 'flex' : 'none';

      if (mode === '3d') {
        camera.aspect = document.getElementById('viewport3d').clientWidth / document.getElementById('viewport3d').clientHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(document.getElementById('viewport3d').clientWidth, document.getElementById('viewport3d').clientHeight);
      }
      if (mode === 'die') renderDieCanvas();
      if (mode === '2d') render2DCanvas();
    }

    function setStep(idx) {
      document.querySelectorAll('.step-btn').forEach((b, i) => b.classList.toggle('active', i === idx));
      document.querySelectorAll('.step-content').forEach((p, i) => p.style.display = i === idx ? 'block' : 'none');
    }

    function updateCustomBg(color) {
      groundMesh.material.color.set(color);
      if (currentView === '2d') render2DCanvas();
    }

    function setBgPreset(mode) {
      document.querySelectorAll('#step-3 .pill-btn').forEach(b => b.classList.remove('active'));
      event?.target?.classList?.add('active');

      if (mode === 'pure_white') {
        updateCustomBg('#ffffff');
        groundMesh.material.map = null;
        groundMesh.material.needsUpdate = true;
        renderer.setClearColor(0xffffff, 1);
      } else if (mode === 'studio') {
        updateCustomBg('#14151a');
        groundMesh.material.map = makeNoiseTexture('studio');
        groundMesh.material.needsUpdate = true;
        renderer.setClearColor(0x111215, 1);
      } else if (mode === 'linen') {
        updateCustomBg('#252422');
        groundMesh.material.map = makeNoiseTexture('linen');
        groundMesh.material.needsUpdate = true;
        renderer.setClearColor(0x181816, 1);
      } else if (mode === 'transparent') {
        renderer.setClearColor(0x000000, 0);
        groundMesh.material.color.set('#000000');
        groundMesh.material.map = null;
        groundMesh.material.needsUpdate = true;
      }
    }

    function setPaper(type) {
      document.querySelectorAll('#step-1 .pill-btn').forEach(b => b.classList.remove('active'));
      event?.target?.classList?.add('active');

      const p = getSelectedProduct();
      if (type === 'coated') { p.metalness = 0.05; p.roughness = 0.35; }
      else if (type === 'matte') { p.metalness = 0.0; p.roughness = 0.85; }
      else if (type === 'holotech') { p.metalness = 0.95; p.roughness = 0.15; }
      else if (type === 'kraft') { p.metalness = 0.0; p.roughness = 0.95; }
      else if (type === 'pearl') { p.metalness = 0.35; p.roughness = 0.45; }
      else if (type === 'clear') { p.metalness = 0.1; p.roughness = 0.05; }

      document.getElementById('metalness').value = p.metalness;
      document.getElementById('roughness').value = p.roughness;
      applyCurrentSettings();
    }

    function updateLighting() {
      const ang = (parseFloat(document.getElementById('lightAngle').value) * Math.PI) / 180;
      keyLight.position.set(Math.cos(ang) * 7, 7, Math.sin(ang) * 7);
      if (currentView === '2d') render2DCanvas(); // 連動 2D 光影投射
    }

    function executeExport() {
      const link = document.createElement('a');
      link.download = `zy-打樣效果圖-${Date.now()}.png`;
      if (currentView === '3d') {
        renderer.render(scene, camera);
        link.href = renderer.domElement.toDataURL('image/png');
      } else if (currentView === 'die') {
        link.href = document.getElementById('canvasDie').toDataURL('image/png');
      } else {
        link.href = document.getElementById('canvas2d').toDataURL('image/png');
      }
      link.click();
    }

    window.addEventListener('resize', () => {
      const c = document.getElementById('viewport3d');
      camera.aspect = c.clientWidth / c.clientHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(c.clientWidth, c.clientHeight);
      if (currentView === 'die') renderDieCanvas();
      if (currentView === '2d') render2DCanvas();
    });

    window.onload = () => {
      init3D();
      selectProduct('p1');
      attachCanvasControls(document.getElementById('canvasDie'), 'die', renderDieCanvas);
      attachCanvasControls(document.getElementById('canvas2d'), 'plan2d', render2DCanvas);
    };
  </script>
</body>
</html>
